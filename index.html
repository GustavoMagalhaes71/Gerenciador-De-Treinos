<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meus Treinos</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--tx:#1b1b1b;--mu:#7a7a75;--ac:#e8590c;--bd:#e3e3de;--ok:#2f9e44;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#1f1f1f;--tx:#f0f0ec;--mu:#98988f;--bd:#333;--ac:#ff8a3d;--ok:#51cf66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--card:#1f1f1f;--tx:#f0f0ec;--mu:#98988f;--bd:#333;--ac:#ff8a3d;--ok:#51cf66;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:0 0 16px;text-align:center}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px}
button{border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--mu);padding:8px 10px;font-weight:500;font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0}
.tab{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap;padding:8px 14px;border-radius:999px;font-size:15px}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hd h2{margin:0;font-size:20px}
.pg{color:var(--mu);font-size:14px}
ul{list-style:none;margin:12px 0 0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--bd)}
li .t{flex:1;font-size:17px;word-break:break-word}
li.done .t{text-decoration:line-through;color:var(--mu)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);background:transparent;padding:0;flex:none;color:#fff;font-size:15px;line-height:1}
li.done .ck{background:var(--ok);border-color:var(--ok)}
.x{background:transparent;color:var(--mu);padding:4px 8px;font-size:18px}
li{flex-wrap:wrap}
.sm{display:block;font-size:13px;color:var(--mu)}
.pr{flex-basis:100%;min-width:0;padding:4px 0 4px 52px}
.sr{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:15px}
.pr .row{margin-top:6px}
.pr input{width:0;padding:9px;font-size:15px}
.pr .row button{padding:9px 16px}
.mn{flex-basis:100%;min-width:0;display:flex;gap:6px;padding:0 0 4px}
.mn .opt{flex:1 1 0;min-width:0;white-space:nowrap;background:transparent;color:var(--tx);border:1px solid var(--bd);padding:9px 4px;font-size:13px}
.mn .del{flex:1 1 0;min-width:0;white-space:nowrap;background:transparent;color:#e03131;border:1px solid var(--bd);padding:9px 4px;font-size:13px}
.dg{flex:none;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--mu);font-size:18px;line-height:1;padding:6px 2px}
li{position:relative}
li.drag{z-index:5;background:var(--card);box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:grabbing}
li.ov{box-shadow:0 -2px 0 var(--ac)}
li.ovb{box-shadow:0 2px 0 var(--ac)}
.dragging,.dragging *{user-select:none;-webkit-user-select:none}
.hw{padding:6px 0;font-size:15px}
.em{color:var(--mu);text-align:center;padding:28px 8px}
</style>
</head>
<body>
<main>
<h1>🏋️ Meus Treinos</h1>
<div class="row"><input id="nl" placeholder="Novo treino (ex: Costas)" maxlength="40"><button id="al">Criar</button></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</main>
<script>
var KEY="treinos-v1",S={lists:[],active:null},editing=false,openId=null,menuId=null,histId=null;
try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);if(p&&Array.isArray(p.lists))S=p}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cur(){return S.lists.find(function(l){return l.id===S.active})}
function pad(n){return n<10?"0"+n:""+n}
function wkey(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate())}
function wlabel(k){var p=k.split("-"),a=new Date(+p[0],+p[1]-1,+p[2]),b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);return pad(a.getDate())+"/"+pad(a.getMonth()+1)+" a "+pad(b.getDate())+"/"+pad(b.getMonth()+1)}
function rollWeek(){var k=wkey(new Date());if(!S.week){S.week=k;save();return false}if(S.week>=k)return false;S.lists.forEach(function(l){l.items.forEach(function(i){if(i.sets&&i.sets.length){(i.hist=i.hist||[]).push({w:S.week,sets:i.sets})}i.sets=[];i.done=false})});S.week=k;save();return true}
function histPanel(i){var h=(i.hist||[]).slice().reverse();return '<div class="pr">'+(h.length?h.map(function(x){return '<div class="hw"><b>'+wlabel(x.w)+'</b><span class="sm">'+(x.sets||[]).map(function(s,n){return "S"+(n+1)+": "+esc(s.kg)+" kg"+(s.reps?" - "+esc(s.reps)+" rep":"")}).join(" | ")+'</span></div>'}).join(""):'<div class="sm">Sem histórico ainda. As séries da semana atual vão para cá quando a semana virar.</div>')+'</div>'}
function sum(i){return i.sets&&i.sets.length?'<small class="sm">'+i.sets.map(function(s,n){return "S"+(n+1)+": "+esc(s.kg)+" kg"+(s.reps?" - "+esc(s.reps)+" rep":"")}).join(" | ")+'</small>':''}
function panel(i){var la=(i.sets||[]).slice(-1)[0]||{kg:"",reps:""};return '<div class="pr">'+(i.sets||[]).map(function(x,n){return '<div class="sr"><span>Série '+(n+1)+' · <b>'+esc(x.kg)+' kg</b>'+(x.reps?' × '+esc(x.reps)+' reps':'')+'</span><button class="x" data-rs="'+i.id+':'+n+'" aria-label="Remover série">×</button></div>'}).join("")+'<div class="row"><input id="kg" type="number" inputmode="decimal" step="0.5" min="0" placeholder="Carga (kg)" value="'+esc(la.kg)+'"><input id="rp" type="number" inputmode="numeric" min="0" placeholder="Reps" value="'+esc(la.reps)+'"><button id="as" data-as="'+i.id+'">+</button></div></div>'}
function addSet(id){var l=cur(),it=l&&l.items.find(function(x){return x.id===id}),k=document.getElementById("kg"),r=document.getElementById("rp");if(!it||!k||!k.value)return;(it.sets=it.sets||[]).push({kg:k.value,reps:r?r.value:""});save();render();var n=document.getElementById("kg");if(n)n.focus()}
function render(){
  var t=document.getElementById("tabs");
  t.innerHTML=S.lists.map(function(l){return '<button class="tab'+(l.id===S.active?' on':'')+'" data-tab="'+l.id+'">'+esc(l.name)+'</button>'}).join("");
  var v=document.getElementById("view"),l=cur();
  if(!l){v.innerHTML='<div class="em">Crie seu primeiro treino acima, como “Costas” ou “Peito”.</div>';return}
  var d=l.items.filter(function(i){return i.done}).length;
  v.innerHTML='<div class="card"><div class="hd">'+(editing?'<input id="rn" value="'+esc(l.name)+'" maxlength="40"><button id="rok" style="margin-left:8px">OK</button>':'<h2>'+esc(l.name)+'</h2><span class="pg">'+d+'/'+l.items.length+' feitos</span>')+'</div>'
   +'<div class="row"><input id="ni" placeholder="Adicionar exercício (ex: Remada 4x10)" maxlength="80"><button id="ai">+</button></div>'
   +'<ul>'+(l.items.length?l.items.map(function(i){return '<li data-id="'+i.id+'" class="'+(i.done?'done':'')+'"><span class="dg" aria-label="Arrastar para reordenar" title="Arrastar para reordenar">⠿</span><button class="ck" data-ck="'+i.id+'" aria-label="Concluir">'+(i.done?'✓':'')+'</button><span class="t">'+esc(i.text)+sum(i)+'</span><button class="x" data-mn="'+i.id+'" aria-label="Mais opções">⋯</button>'+(menuId===i.id?'<div class="mn"><button class="opt" data-pg="'+i.id+'">📈 Progressão</button><button class="opt" data-hs="'+i.id+'">📅 Histórico</button><button class="del" data-rm="'+i.id+'">🗑 Excluir</button></div>':'')+(openId===i.id?panel(i):'')+(histId===i.id?histPanel(i):'')+'</li>'}).join(""):'<div class="em">Nenhum exercício ainda.</div>')+'</ul>'
   +'<div class="row" style="margin-top:10px;justify-content:space-between"><button class="g" id="rs">Desmarcar todos</button><button class="g" id="rnb">Renomear</button><button class="g" id="dl">Excluir treino</button></div></div>';
}
function addList(){var i=document.getElementById("nl"),n=i.value.trim();if(!n)return;var l={id:uid(),name:n,items:[]};S.lists.push(l);S.active=l.id;i.value="";save();render()}
function addItem(){var i=document.getElementById("ni"),n=i.value.trim(),l=cur();if(!n||!l)return;l.items.push({id:uid(),text:n,done:false});save();render();document.getElementById("ni").focus()}
function rename(){var l=cur(),i=document.getElementById("rn");if(l&&i&&i.value.trim())l.name=i.value.trim();editing=false;save();render()}
var dg=null;
document.addEventListener("pointerdown",function(e){var h=e.target.closest&&e.target.closest(".dg");if(!h)return;var li=h.closest("li");if(!li)return;dg={el:li,id:li.dataset.id,y0:e.clientY,to:null,moved:false};li.classList.add("drag");document.body.classList.add("dragging");try{h.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
document.addEventListener("pointermove",function(e){if(!dg)return;dg.moved=true;dg.el.style.transform="translateY("+(e.clientY-dg.y0)+"px)";var lis=[].slice.call(dg.el.parentNode.children).filter(function(c){return c!==dg.el&&c.tagName==="LI"});lis.forEach(function(c){c.classList.remove("ov","ovb")});dg.to=null;for(var k=0;k<lis.length;k++){var r=lis[k].getBoundingClientRect();if(e.clientY<r.top+r.height/2){dg.to=lis[k];break}}if(dg.to)dg.to.classList.add("ov");else if(lis.length)lis[lis.length-1].classList.add("ovb")});
function endDrag(){if(!dg)return;var d=dg;dg=null;document.body.classList.remove("dragging");var l=cur();if(l&&d.moved){var it=l.items.find(function(x){return x.id===d.id});if(it){l.items.splice(l.items.indexOf(it),1);var ti=d.to?l.items.findIndex(function(x){return x.id===d.to.dataset.id}):-1;l.items.splice(ti<0?l.items.length:ti,0,it);save()}}render()}
document.addEventListener("pointerup",endDrag);
document.addEventListener("pointercancel",endDrag);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&rollWeek())render()});
document.getElementById("al").onclick=addList;
document.getElementById("nl").onkeydown=function(e){if(e.key==="Enter")addList()};
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b){if(menuId){menuId=null;render()}return}var l=cur();if(!b.dataset.mn)menuId=null;
  if(b.dataset.tab){S.active=b.dataset.tab;editing=false}
  else if(b.id==="ai"){return addItem()}
  else if(b.dataset.ck&&l){var it=l.items.find(function(x){return x.id===b.dataset.ck});if(it)it.done=!it.done}
  else if(b.dataset.rm&&l){l.items=l.items.filter(function(x){return x.id!==b.dataset.rm})}
  else if(b.id==="rs"&&l){l.items.forEach(function(x){x.done=false})}
  else if(b.id==="rnb"&&l){editing=true;render();var r=document.getElementById("rn");if(r){r.focus();r.select()}return}
  else if(b.id==="rok"&&l){return rename()}
  else if(b.dataset.mn&&l){if(openId===b.dataset.mn||histId===b.dataset.mn){openId=null;histId=null;menuId=null}else{menuId=menuId===b.dataset.mn?null:b.dataset.mn}}
  else if(b.dataset.hs&&l){openId=null;histId=histId===b.dataset.hs?null:b.dataset.hs}
  else if(b.dataset.pg&&l){histId=null;openId=openId===b.dataset.pg?null:b.dataset.pg}
  else if(b.dataset.rs&&l){var q=b.dataset.rs.split(":"),it2=l.items.find(function(x){return x.id===q[0]});if(it2&&it2.sets)it2.sets.splice(+q[1],1)}
  else if(b.dataset.as&&l){return addSet(b.dataset.as)}
  else if(b.id==="dl"&&l){if(!confirm("Excluir o treino "+l.name+"?"))return;S.lists=S.lists.filter(function(x){return x.id!==l.id});S.active=S.lists.length?S.lists[0].id:null;editing=false}
  else return;
  save();render();
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="ni")addItem();if(e.key==="Enter"&&e.target.id==="rn")rename();if(e.key==="Enter"&&(e.target.id==="kg"||e.target.id==="rp"))addSet(openId);if(e.key==="Escape"&&e.target.id==="rn"){editing=false;render()}});
if(!cur()&&S.lists.length)S.active=S.lists[0].id;
rollWeek();
render();
</script>
</body>
</html>
